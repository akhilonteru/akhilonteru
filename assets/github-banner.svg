<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#101827"/>
<stop offset="0.55" stop-color="#123b5d"/>
<stop offset="1" stop-color="#173f9a"/>
</linearGradient>

<linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#22d3ee"/>
<stop offset="1" stop-color="#3b82f6"/>
</linearGradient>

<filter id="shadow">
<feGaussianBlur stdDeviation="8"/>
</filter>

</defs>

<!-- Background -->

<rect width="1280" height="360" rx="28" fill="url(#bg)"/>

<circle cx="1100" cy="80" r="180"
fill="#2563eb"
opacity=".12"
filter="url(#shadow)"/>

<circle cx="180" cy="300" r="150"
fill="#06b6d4"
opacity=".08"
filter="url(#shadow)"/>


<!-- Subtle Grid -->

<g opacity=".12" stroke="#7dd3fc">

